<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
<defs>
  <linearGradient id="sky-trex" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#242a24"/>
    <stop offset="55%" stop-color="#171b17"/>
    <stop offset="100%" stop-color="#0d0f0d"/>
  </linearGradient>
  <radialGradient id="sun-trex" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#8BE13C" stop-opacity=".55"/>
    <stop offset="70%" stop-color="#8BE13C" stop-opacity=".10"/>
    <stop offset="100%" stop-color="#8BE13C" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="body-trex" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8BE13C"/>
    <stop offset="100%" stop-color="#1b2a14"/>
  </linearGradient>
</defs>

<rect width="800" height="460" fill="url(#sky-trex)"/>
<circle cx="592" cy="150" r="185" fill="url(#sun-trex)"/>
<circle cx="592" cy="150" r="74" fill="#8BE13C" opacity=".16"/>

