<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>Social card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#101210;overflow:hidden}
.card{position:relative;width:1200px;height:630px;overflow:hidden;
 background:radial-gradient(circle at 88% 20%,rgba(139,225,60,.30),transparent 46%),
            radial-gradient(circle at 6% 90%,rgba(255,212,39,.14),transparent 52%),#101210;
 padding:70px 76px;display:flex;align-items:center;justify-content:space-between;
 border-top:10px solid #4CAF2E;border-bottom:10px solid #FFD427;
 font-family:'Rubik',Arial,sans-serif}
.left{max-width:620px;position:relative;z-index:3}
.kick{font-family:'Bungee',Impact,sans-serif;font-size:18px;letter-spacing:7px;color:#8BE13C;margin-bottom:20px}
h1{font-family:'Bungee',Impact,sans-serif;font-weight:400;font-size:84px;line-height:.96;color:#F7F7F2}
h1 .g{color:#8BE13C}
.rule{width:132px;height:8px;background:#FFD427;margin:28px 0 24px;border-radius:99px}
p{font-size:25px;line-height:1.4;color:#CFD6CD;font-weight:600}
.foot{margin-top:32px;font-size:14px;letter-spacing:3.4px;color:#7C8A78;font-weight:800}
.foot b{color:#8BE13C}
.emblem{position:relative;width:352px;height:352px;flex-shrink:0;z-index:3}
.ring{position:absolute;inset:0;border-radius:50%;border:9px solid #4CAF2E;overflow:hidden;
 box-shadow:0 0 0 16px rgba(139,225,60,.12),0 28px 64px rgba(0,0,0,.75)}
.ring img{width:100%;height:100%;object-fit:cover;display:block}
.chip{position:absolute;bottom:2px;left:50%;transform:translateX(-50%) rotate(-3deg);
 background:#FFD427;color:#101210;font-family:'Bungee',Impact,sans-serif;font-size:17px;letter-spacing:1.5px;
 padding:10px 24px;border-radius:99px;white-space:nowrap;box-shadow:0 8px 22px rgba(0,0,0,.65)}
.deco{position:absolute;font-size:250px;opacity:.045;z-index:1;user-select:none}
.d1{left:-40px;top:-60px;transform:rotate(-18deg)}
.d2{right:330px;bottom:-90px;transform:rotate(14deg);font-size:200px}
</style></head><body>
<div class="card">
  <div class="deco d1">&#129460;</div>
  <div class="deco d2">&#127755;</div>
  <div class="left">
    <div class="kick">MAUI&#8217;S</div>
    <h1>DINO<br><span class="g">ZONE</span></h1>
    <div class="rule"></div>
    <p>Giant hunters. Armoured tanks. Long neck legends.<br>Five dinosaurs, full ID files, a battle arena and a quiz.</p>
    <div class="foot">BUILT BY MAUI &nbsp;&middot;&nbsp; <b>POWERED BY AI CAPITAL APPS</b></div>
  </div>
  <div class="emblem">
    <div class="ring"><img src="trex.jpg" alt=""></div>
    <div class="chip">&#129430;&nbsp; 5 LEGENDS</div>
  </div>
</div></body></html>
