<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
<defs>
  <linearGradient id="sky-dilophosaurus" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#242a24"/>
    <stop offset="55%" stop-color="#171b17"/>
    <stop offset="100%" stop-color="#0d0f0d"/>
  </linearGradient>
  <radialGradient id="sun-dilophosaurus" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFD427" stop-opacity=".55"/>
    <stop offset="70%" stop-color="#FFD427" stop-opacity=".10"/>
    <stop offset="100%" stop-color="#FFD427" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="body-dilophosaurus" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFD427"/>
    <stop offset="100%" stop-color="#1b2a14"/>
  </linearGradient>
</defs>

<rect width="800" height="460" fill="url(#sky-dilophosaurus)"/>
<circle cx="592" cy="150" r="185" fill="url(#sun-dilophosaurus)"/>
<circle cx="592" cy="150" r="74" fill="#FFD427" opacity=".16"/>

<!-- far hills -->
<path d="M0 372 L92 322 L168 356 L248 306 L336 352 L432 300 L540 350 L640 312 L724 352 L800 322 L800 460 L0 460 Z" fill="#0b0d0b" opacity=".85"/>

<!-- ground -->
<rect y="400" width="800" height="60" fill="#0a0c0a"/>


