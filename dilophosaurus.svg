  <path d="M682 120 Q696 92 714 68"/>
</g>
<!-- eye + teeth -->
<circle cx="716" cy="146" r="6" fill="#0a0c0a"/>
<circle cx="718" cy="144" r="2.5" fill="#FFD427"/>
<g fill="#F7F7F2">
